<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceBookworm | Βιβλία & Κριτικές</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="logo-container">
            <div style="display: flex; align-items: center; gap: 10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
                <span class="logo-text">FaceBookworm</span>
            </div>
        </div>
        <nav class="main-nav">
            <a href="homepage.html">Αρχική</a>
            <a href="items.html" class="active">Βιβλία & Κριτικές</a>
        </nav>
    </header>

    <main>
        <section class="search-filter-section">
            <input type="text" class="search-bar" placeholder="Αναζήτηση τίτλου, συγγραφέα...">
            
            <div class="category-filters">
                <button type="button" class="category-btn active">Όλα τα Βιβλία</button>
                <button type="button" class="category-btn">Ρομάντζο</button>
                <button type="button" class="category-btn">Φαντασία / Sci-Fi</button>
                <button type="button" class="category-btn">Κλασικά</button>
                <button type="button" class="category-btn">Θρίλερ / Μυστήριο</button>
                <button type="button" class="category-btn">Ελληνική Λογοτεχνία</button>
            </div>
        </section>

        <section class="items-section">
            <div class="cards-grid" id="search-container">
                
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>FaceBookworm © 2026 | Ομάδα: [Τσιμερίκας Αλέξιος], [Νικολάου Μιχαήλ], [Βίτκου Μαρία]</p>
    </footer>
    
    <script src="items.js"></script>

</body>
</html>
