<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceBookworm | Βιβλία & Κριτικές</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="main-header">
        <div class="logo-container">
            <div style="display: flex; align-items: center; gap: 10px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2c3e50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
                <span class="logo-text">FaceBookworm</span>
            </div>
        </div>
        <nav class="main-nav">
            <a href="homepage.html">Αρχική</a>
            <a href="items.html" class="active">Βιβλία & Κριτικές</a>
        </nav>
    </header>

    <main>
        <section class="search-filter-section">
            <div class="search-container">
                <input type="text" class="search-bar" placeholder="Αναζήτηση τίτλου">
                <button id="searchBtn">Αναζήτηση</button>
            </div>
            
            <div class="category-filters">
                <button type="button" class="category-btn active" data-category="all">Όλα τα Βιβλία</button>
                <button type="button" class="category-btn" data-category="Ρομάντζο">Ρομάντζο</button>
                <button type="button" class="category-btn" data-category="Φαντασία">Φαντασία</button>
                <button type="button" class="category-btn" data-category="Κλασικά">Κλασικά</button>
                <button type="button" class="category-btn" data-category="Θρίλερ">Θρίλερ</button>
                <button type="button" class="category-btn" data-category="Μυστήριο">Μυστήριο</button>
                <button type="button" class="category-btn" data-category="Δράσης/Αστυνομικά">Αστυνομικά</button>
            </div>
        </section>

        <section class="items-section">
            <div class="cards-grid" id="search-container">
                
            </div>
        </section>
    </main>

    <div id="reviewsModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeReviewsModal">&times;</span>
            <h2>Κριτικές Βιβλίου</h2>
            <div id="reviewsList">
                </div>
        </div>
    </div>

    <div id="addReviewModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeAddReviewModal">&times;</span>
            <h2>Προσθήκη Νέας Κριτικής</h2>
            <form id="addReviewForm">
                <input type="hidden" id="reviewBookId">
                
                <div class="form-group">
                    <label for="reviewUser">Όνομα:</label>
                    <input type="text" id="reviewUser" required placeholder="Το όνομά σας">
                </div>
                
                <div class="form-group">
                    <label for="reviewRating">Βαθμολογία (1-5):</label>
                    <input type="number" id="reviewRating" min="1" max="5" required placeholder="π.χ. 5">
                </div>
                
                <div class="form-group">
                    <label for="reviewComment">Σχόλιο:</label>
                    <textarea id="reviewComment" rows="4" required placeholder="Γράψτε την άποψή σας..."></textarea>
                </div>
                
                <button type="submit" class="submit-review-btn">Υποβολή Κριτικής</button>
            </form>
        </div>
    </div>

    <footer class="main-footer">
        <p>FaceBookworm © 2026 | Ομάδα: [Τσιμερίκας Αλέξιος], [Νικολάου Μιχαήλ], [Βίτκου Μαρία]</p>
    </footer>
    
    <script src="items.js"></script>

</body>
</html>
